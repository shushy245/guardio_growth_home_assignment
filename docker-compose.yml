services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: breachscan
      POSTGRES_PASSWORD: breachscan
      POSTGRES_DB: breachscan
    ports:
      # 5433 on the host so a locally installed Postgres on 5432 never collides. Bound to
      # loopback like every other published port here: this stack is a development stack.
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breachscan -d breachscan"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # Secrets live in .env — required, because there is no safe default for one. The non-secret
    # values below still default, so .env only has to carry what actually matters.
    env_file:
      - path: .env
        required: true
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql+psycopg://breachscan:breachscan@db:5432/breachscan
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      HIBP_USER_AGENT: ${HIBP_USER_AGENT:-breach-scan-funnel}
      # No default: a token committed here is a token everyone who clones the repo has, and it
      # gates the write that rewrites what every visitor reads. Missing, the stack refuses to
      # start and says so.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env — cp .env.example .env, then generate one with `openssl rand -hex 24`}
    ports:
      # Loopback: the API is reached through the frontend's /api proxy, and a published 0.0.0.0
      # port is one every machine on the network can reach — which, with the header trust that
      # only holds behind the proxy, is not a port to offer them.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      - backend

volumes:
  db-data:
