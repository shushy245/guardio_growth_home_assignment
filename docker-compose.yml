services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: breachscan
      POSTGRES_PASSWORD: breachscan
      POSTGRES_DB: breachscan
    ports:
      # 5433 on the host so a locally installed Postgres on 5432 never collides
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breachscan -d breachscan"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://breachscan:breachscan@db:5432/breachscan
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
