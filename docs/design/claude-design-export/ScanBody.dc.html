<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>@keyframes bs-scan-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}</style>
</helmet>
<div style="{{ frameStyle }}">
  <div style="{{ innerStyle }}">
    <div style="font-size:20px;font-weight:700;color:oklch(38% 0.09 235);margin-bottom:48px;">Guardio</div>

    <sc-if value="{{ showScanning }}" hint-placeholder-val="{{ true }}">
      <span style="width:64px;height:64px;border-radius:50%;border:4px solid oklch(95% 0.025 200);border-top-color:oklch(32% 0.13 200);display:inline-block;margin-bottom:28px;{{ spinStyle }}"></span>
      <p style="font-size:18px;color:oklch(45% 0.015 240);margin:0 0 20px;">Checking 1,031 known breaches…</p>
      <div style="width:240px;height:8px;border-radius:999px;background:oklch(93% 0.006 240);overflow:hidden;">
        <div style="height:100%;border-radius:999px;background:oklch(32% 0.13 200);{{ barStyle }}"></div>
      </div>
      <p style="font-size:16px;color:oklch(45% 0.015 240);margin:16px 0 0;">{{ reducedNote }}</p>
    </sc-if>

    <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
      <div style="width:56px;height:56px;border-radius:12px;border:2px solid oklch(45% 0.19 25);margin-bottom:20px;"></div>
      <p style="font-size:18px;font-weight:600;margin:0 0 8px;">We couldn't reach the breach record</p>
      <p style="font-size:16px;color:oklch(45% 0.015 240);margin:0 0 24px;max-width:280px;">Try again in a moment.</p>
      <button style="font-family:inherit;font-size:16px;font-weight:600;padding:14px 28px;min-height:48px;border-radius:12px;background:oklch(32% 0.13 200);color:oklch(99% 0 0);border:none;">Try again</button>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:560},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:390,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:390,&quot;max&quot;:1280},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;scanning&quot;,&quot;tsType&quot;:&quot;'scanning'|'error'&quot;,&quot;options&quot;:[&quot;scanning&quot;,&quot;error&quot;]}}">
class Component extends DCLogic {
  state = { progress: 0 };

  componentDidMount() {
    if (this.props.state !== 'scanning') return;
    this.reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (this.reduced) { this.setState({ progress: 1 }); return; }
    const start = performance.now();
    const dur = 2000;
    const tick = (t) => {
      const p = Math.min(1, (t - start) / dur);
      this.setState({ progress: p });
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  renderVals() {
    const width = this.props.width || 390;
    const st = this.props.state || 'scanning';
    const frameStyle = {
      width: width + 'px', flexShrink: 0, fontFamily: "'Source Sans 3',system-ui,sans-serif",
      background: 'oklch(100% 0 0)', border: '1px solid oklch(87% 0.008 240)', borderRadius: '16px', overflow: 'hidden'
    };
    const innerStyle = { minHeight: '520px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', padding: '32px' };
    const reduced = this.reduced;
    const spinStyle = reduced ? '' : 'animation: bs-scan-spin 0.9s linear infinite;';
    const barStyle = 'width:' + Math.round(this.state.progress * 100) + '%;';
    const reducedNote = reduced ? 'Reduced motion: showing progress without animation.' : '';
    return { frameStyle, innerStyle, showScanning: st === 'scanning', showError: st === 'error', spinStyle, barStyle, reducedNote };
  }
}
</script>
</body>
</html>
