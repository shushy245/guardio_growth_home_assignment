<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Code+Pro:wght@500&display=swap" rel="stylesheet">
<style>body{margin:0;background:oklch(97% 0.004 240);}</style>
</helmet>
<div style="font-family:'Source Sans 3',system-ui,sans-serif;padding:48px 32px 120px;color:oklch(22% 0.02 240);">
  <div style="max-width:1120px;margin:0 auto 32px;">
    <div style="font-size:16px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:oklch(40% 0.13 200);margin-bottom:8px;">Breach Scan — S-6 Experiment dashboard (optional)</div>
    <h1 style="font-size:42px;line-height:1.15;font-weight:700;margin:0 0 12px;">Experiment dashboard</h1>
    <div style="display:flex;flex-direction:column;gap:6px;font-size:16px;color:oklch(45% 0.015 240);background:oklch(100% 0 0);border:1px solid oklch(87% 0.008 240);border-radius:12px;padding:16px 20px;max-width:65ch;">
      <div><strong style="color:oklch(22% 0.02 240);">390 → 768:</strong> cards stay stacked; only padding and card width grow.</div>
      <div><strong style="color:oklch(22% 0.02 240);">768 → 1280:</strong> the funnel chart and lift card move from stacked to side by side.</div>
    </div>
  </div>

  <div style="max-width:1120px;margin:0 auto 16px;font-size:16px;font-weight:700;">Loaded, at each width</div>
  <div style="display:flex;gap:24px;overflow-x:auto;padding-bottom:24px;">
    <div style="display:flex;flex-direction:column;gap:10px;"><span style="font-size:16px;font-family:'Source Code Pro',monospace;">390</span><dc-import name="DashboardBody" width="390" state="loaded" hint-size="390px,700px"></dc-import></div>
    <div style="display:flex;flex-direction:column;gap:10px;"><span style="font-size:16px;font-family:'Source Code Pro',monospace;">768</span><dc-import name="DashboardBody" width="768" state="loaded" hint-size="768px,700px"></dc-import></div>
    <div style="display:flex;flex-direction:column;gap:10px;"><span style="font-size:16px;font-family:'Source Code Pro',monospace;">1280</span><dc-import name="DashboardBody" width="1280" state="loaded" hint-size="1280px,520px"></dc-import></div>
  </div>

  <div style="max-width:1120px;margin:0 auto 16px;font-size:16px;font-weight:700;">Other states — 1280</div>
  <div style="display:flex;gap:24px;overflow-x:auto;padding-bottom:24px;">
    <div style="display:flex;flex-direction:column;gap:10px;"><span style="font-size:16px;font-family:'Source Code Pro',monospace;">keep-running</span><dc-import name="DashboardBody" width="1280" state="keep-running" hint-size="1280px,520px"></dc-import></div>
    <div style="display:flex;flex-direction:column;gap:10px;"><span style="font-size:16px;font-family:'Source Code Pro',monospace;">error</span><dc-import name="DashboardBody" width="1280" state="error" hint-size="1280px,520px"></dc-import></div>
  </div>
</div>

</x-dc>
</body>
</html>
