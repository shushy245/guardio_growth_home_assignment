[project]
name = "breach-scan-backend"
version = "0.1.0"
description = "Breach Scan funnel backend: HIBP catalog, feature flags, funnel events, sign-up, experiment read"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.53,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.0.54,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "argon2-cffi>=25.1,<26",
    "scipy>=1.18,<2",
    "structlog>=26.1,<27",
    "python-ulid>=4.0,<5",
    "httpx2>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
    "mypy>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# ruff — lint + format (the eslint + prettier analogue). Rule families, with why:
#   E/W/F  pycodestyle + pyflakes basics          I    import sorting
#   N      pep8 naming                             UP   modern syntax
#   B      bugbear: likely bugs                    SIM  simplify
#   RET    consistent returns (guard clauses)      ANN  every def is annotated
#   S      bandit security checks                  T20  no print()
#   PL     pylint subset (complexity, magic values) RUF  ruff-specific
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RET", "ANN", "S", "T20", "PL", "RUF"]
ignore = [
    "PLR2004", # magic values in tests are the expected values; mypy + names cover production
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the assertion library in pytest
    "S105",    # hard-coded "password" strings are test fixtures, not credentials
    "S106",
]
"scripts/**" = ["T20"] # CLI scripts print by design

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy — strict static typing (the tsc --strict analogue)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------------------------------------------------------------------------
# pytest — unit tests need nothing; integration tests need the compose db running
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Warnings are errors so our own deprecations cannot be ignored. The one exemption is an
# upstream alias deprecation raised inside starlette.testclient's import of anyio (starlette 1.6);
# remove the ignore when a starlette release no longer triggers it.
filterwarnings = [
    "error",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "integration: hits the real Postgres from docker-compose (TEST_DATABASE_URL)",
]
