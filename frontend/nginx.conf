server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: every unknown path serves index.html so client-side routes deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API in the compose stack; mirrors the Vite dev proxy.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;

        # Without these the backend sees nginx as the client and plain http as the scheme, so
        # every request in the log comes from the same container address. uvicorn reads
        # X-Forwarded-For and X-Forwarded-Proto back into request.client and request.url.scheme
        # (--proxy-headers in the backend CMD).
        #
        # `$remote_addr`, never `$proxy_add_x_forwarded_for`: the latter *appends* the real peer
        # to whatever the caller sent, and uvicorn trusts the leftmost entry — so a client that
        # sends its own X-Forwarded-For chooses the address we log. This is the edge; the peer
        # address is the only trustworthy thing here, and it overwrites rather than extends.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
